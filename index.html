            border-bottom-color: rgba(0, 0, 0, 0.06) !important;

        /* 5. Reveal 3D background without breaking text color */
        html,

            color: #1d1d1f;
            background-color: #f4f4f7 !important;
        }

        #root,
        #root>div,
        #root>div>div.min-h-screen {

        }

        #root {

            filter: blur(20px);
            transition: opacity 2.5s cubic-bezier(0.16, 1, 0.3, 1), transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), filter 2.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;

        #root.reveal {
            opacity: 1;
            transform: none;
            filter: none;
            pointer-events: auto;

        /* Keep project cards solid - Light mode card */
        div.bg-\[\#0d0d0f\].border-\[\#1a1a1e\].rounded-3xl {
            background-color: rgba(255, 255, 255, 0.75) !important;
            border-color: rgba(0, 0, 0, 0.06) !important;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.05) !important;

        /* 6. Hide default React loader to use Three.js dust as loader */
        div.bg-\[\#08080a\].z-\[100\] {
            display: none !important;
        }

        /* 7. Three.js Canvas Background - Light Mode */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background-color: #f4f4f7;
        }

        /* 8. Hide the custom React circle/dot cursor and restore system cursor */
        .cursor-dot,
        .cursor-ring {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        body,
        a,
        button,
        [role="button"] {
            cursor: auto !important;
        }

        /* 9. Unique Profile Image Frame Polish - Light Mode */
        div[class*="aspect-[4/5]"] {
            position: relative !important;
            border: none !important;
            border-radius: 2rem !important;
            max-width: 480px !important;
            box-shadow:

        /* Glowing aura background animation - Light Mode Warm Accent */
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        div[class*="aspect-[4/5]"]::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: calc(2rem + 4px);
            background: linear-gradient(45deg,
                    rgba(232, 178, 122, 0) 0%,
                    rgba(232, 178, 122, 0) 30%,
                    #e8b27a 60%,
                    rgba(232, 178, 122, 0) 80%,
                    rgba(232, 178, 122, 0) 100%);

            animation: gradientMove 4s ease infinite;
            z-index: -1;
            opacity: 0.8;
            transition: opacity 0.5s ease, filter 0.5s ease;
            filter: blur(8px);
        }

        /* Hover effects */
        div[class*="aspect-[4/5]"]:hover {
            transform: perspective(1200px) rotateY(0deg) rotateX(0deg) scale(1.02) translateY(-10px);
            box-shadow:

        div[class*="aspect-[4/5]"]:hover::before {

        }

        @keyframes epicPaperPlaneFly {

        @keyframes bgFloat {

    <script>
        // Monochrome Loader & Spotlight logic
        document.addEventListener("DOMContentLoaded", () => {
            const percentEl = document.getElementById("loader-percent");
            const loaderEl = document.getElementById("custom-loader");
            const rootEl = document.getElementById("root");

            let count = 0;
            const duration = 1200; // 1.2s count up
            const intervalTime = 12;
            const step = 100 / (duration / intervalTime);

            const timer = setInterval(() => {
                count += step;
                if (count >= 100) {
                    count = 100;
                    clearInterval(timer);

                    if (loaderEl) {
                        loaderEl.classList.add("fade-out");
                        setTimeout(() => loaderEl.remove(), 1200);
                    }

                    if (rootEl) {
                        rootEl.classList.add("reveal");
                    }
                }
                if (percentEl) {
                    percentEl.textContent = String(Math.floor(count)).padStart(2, '0');
                }
            }, intervalTime);

            const spotlight = document.getElementById("spotlight");
            document.addEventListener("mousemove", (e) => {
                if (spotlight) {
                    spotlight.style.setProperty("--mouse-x", `${e.clientX}px`);
                    spotlight.style.setProperty("--mouse-y", `${e.clientY}px`);
                }
            });

            // Scroll reveal observer
            const observerOptions = {
                root: null,
                rootMargin: "0px",
                threshold: 0.08
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target); // Trigger once
                    }
                });
            }, observerOptions);

            // Wait briefly for React elements to mount, then attach reveals
            setTimeout(() => {
                // Select sections, cards, and custom stack section
                const targets = document.querySelectorAll(
                    "section, div.bg-\\[\\#0c0c10\\].border-\\[\\#2a2a32\\].rounded-\\[32px\\], #custom-skills-revamp"
                );
                targets.forEach(el => {
                    el.classList.add("scroll-reveal");
                    revealObserver.observe(el);
                });
            }, 1000);
        });
    </script>
